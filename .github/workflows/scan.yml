name: Deal scan

on:
  schedule:
    - cron: "17 * * * *"  # every hour at :17 (GitHub is busiest on the hour)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: scan and print, send nothing"
        type: boolean
        default: true

permissions:
  contents: write  # to save seen.json / found_deals.csv after each run

concurrency:
  group: deal-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pinned to exact commits so the workflow can't silently pick up different code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install requests==2.34.2
      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python deal_scanner.py $DRY_RUN
      - name: Remember what was sent
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json found_deals.csv
          if ! git diff --cached --quiet; then
            git commit -m "Remember sent deals"
            git pull --rebase
            git push
          fi
